name: hadoop-streaming

# Chạy mapper/reducer trên Hadoop 3.3.6 thật (standalone, runner GitHub) với dữ liệu synthetic cùng schema REES46,
# rồi so với bản giả lập Unix pipe. Bằng chứng (log + JSON) được commit vào nhánh results/hadoop-<run id>.
# Đây là kiểm chứng cách chạy trên Hadoop thật, không phải số liệu của dữ liệu thật.
on:
  workflow_dispatch:
    inputs:
      users:
        description: "Số người dùng synthetic"
        default: "3000"

permissions:
  contents: write

jobs:
  hadoop:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "11" }
      - run: pip install -q numpy
      - name: Synthetic data
        run: python tools/make_synthetic.py --out data/sample --users "${{ inputs.users }}"
      - name: Unix-pipe emulation
        run: hadoop/run_local_mapreduce.sh data/sample/2019-Oct.csv work/pipe
      - name: Real Hadoop 3.3.6 (standalone)
        run: |
          mkdir -p results/hadoop
          export HADOOP_HOME=/tmp/hadoop-3.3.6
          { time hadoop/run_hadoop_streaming.sh "$PWD/data/sample/2019-Oct.csv" "$PWD/work/hadoop"; } \
            > results/hadoop/hadoop_run.log 2>&1 || { tail -50 results/hadoop/hadoop_run.log; exit 1; }
          grep -E "Running job|completed successfully|Map input records|Reduce output records|^real" results/hadoop/hadoop_run.log | tee results/hadoop/hadoop_summary.txt
      - name: Compare Hadoop vs pipe
        run: |
          python tools/compare_mapreduce.py work/hadoop work/pipe results/hadoop/hadoop_vs_pipe.json \
            hadoop_version=3.3.6 data=synthetic users="${{ inputs.users }}" run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Commit evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/hadoop || true
          git diff --cached --quiet && exit 0
          br="results/hadoop-${{ github.run_id }}"
          git switch -c "$br"
          git commit -m "results(hadoop): Hadoop 3.3.6 streaming run on synthetic data"
          git push origin "$br"
